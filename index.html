
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reto Bíblico - Librería Logos</title>
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f7f4; margin: 0; overflow: hidden; color: #333; }
        
        /* Pantalla de Inicio */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1b5e20; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: white; padding: 30px; }
        .btn-start { padding: 18px 45px; background: #fff; color: #1b5e20; border-radius: 50px; font-size: 1.4em; border: none; font-weight: bold; cursor: pointer; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        /* Anuncio flotante superior */
        #asistente { 
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
            background: #fff9c4; color: #333; padding: 12px; border-radius: 12px; 
            font-size: 0.9em; z-index: 1500; display: none; width: 90%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 2px solid #fbc02d; font-weight: bold;
        }

        /* Diseño del Juego */
        .header { background: #2e7d32; color: white; padding: 12px; font-weight: bold; font-size: 1em; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #verse-container { background: white; padding: 15px; margin: 10px; border-radius: 15px; border-left: 8px solid #2e7d32; min-height: 90px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #verse-text { font-size: 1.2rem; color: #1b5e20; font-weight: 700; line-height: 1.3; font-style: italic; }

        /* Tablero */
        #grid { display: grid; grid-template-columns: repeat(12, 1fr); width: 95vw; max-width: 450px; background: #bdc3c7; gap: 1px; margin: 5px auto; border: 3px solid #2e7d32; border-radius: 4px; }
        .cell { aspect-ratio: 1/1; background: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; transition: background 0.2s; }
        .sel { background: #fff176 !important; color: #000; }
        .found { background: #a5d6a7 !important; color: #1b5e20 !important; }

        /* Lista de palabras inferior */
        #word-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 15px; height: 120px; overflow-y: auto; background: #fafafa; border-top: 2px solid #eee; }
        .word-item { padding: 5px 10px; background: white; border-radius: 8px; font-size: 11px; font-weight: bold; color: #2e7d32; border: 1px solid #c8e6c9; text-transform: uppercase; }
        .word-found { background: #2e7d32 !important; color: white !important; text-decoration: line-through; opacity: 0.7; }

        /* Modal Éxito */
        .modal-ad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; }
        .ad-card { background: white; padding: 35px 25px; border-radius: 25px; width: 85%; max-width: 350px; text-align: center; border: 5px solid #2e7d32; }
        .btn-next { background: #2e7d32; color: white; padding: 18px; border: none; border-radius: 40px; font-weight: bold; width: 100%; font-size: 1.2em; cursor: pointer; margin-top: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .wa-link { color: #a5d6a7; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="overlay">
        <div style="font-size: 1.8em; font-weight: 900; margin-bottom: 10px;">¡Bienvenido!</div>
        <div style="font-size: 1.1em; margin-bottom: 25px; opacity: 0.9;">Completa el versículo encontrando las palabras clave.</div>
        <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);">
            <div style="font-weight: bold; font-size: 1.3em;">Librería Cristiana Logos</div>
            <div style="font-size: 0.85em; margin-top: 10px; opacity: 0.8;">Calle 35C Sur No 78A-18<br>Kennedy Central, Bogotá</div>
            <div style="margin-top: 15px;">
                <a href="https://wa.me/573125756581" class="wa-link">📲 WhatsApp: 312-5756581</a>
            </div>
        </div>
        <button class="btn-start" id="start-btn">INICIAR JUEGO</button>
    </div>

    <div id="asistente">
        🎁 PROMO DEL MES <br>
        <span style="font-size: 1.1em; color: #d32f2f;">10% DCTO en Biblias Reina Valera</span>
    </div>

    <div id="ad-modal" class="modal-ad">
        <div class="ad-card">
            <div style="font-size: 60px;">🌟</div>
            <div style="font-size: 1.6em; font-weight: 900; color: #1b5e20;">¡EXCELENTE TRABAJO!</div>
            <p id="stats-text" style="font-size: 1.1em; margin: 20px 0; color: #555;"></p>
            <button class="btn-next" id="btn-next-lvl">SIGUIENTE RETO</button>
        </div>
    </div>

    <div class="header" id="lvl-tag">NIVEL 1</div>
    <div id="verse-container"><div id="verse-text">Cargando versículo...</div></div>
    <div id="grid"></div>
    <div id="word-list"></div>

    <script>
        const niveles = [{"v": "Lampara es a mis pies tu palabra, Y lumbrera a mi camino.", "r": "Salmo 119:105"}, {"v": "Todo lo puedo en Cristo que me fortalece.", "r": "Filipenses 4:13"}, {"v": "Jehova es mi pastor; nada me faltara.", "r": "Salmo 23:1"}, {"v": "En el principio creo Dios los cielos y la tierra.", "r": "Genesis 1:1"}, {"v": "Ellos dijeron: Cree en el Senor Jesucristo, y seras salvo, tu y tu casa.", "r": "Hechos 16:31"}, {"v": "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece;", "r": "1 Corintios 13:4"}, {"v": "Clama a mi, y yo te respondere, y te ensenare cosas grandes y ocultas que tu no conoces.", "r": "Jeremias 33:3"}, {"v": "Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os seran anadidas.", "r": "Mateo 6:33"}, {"v": "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehova tu Dios estara contigo en dondequiera que vayas.", "r": "Josue 1:9"}, {"v": "Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.", "r": "Salmo 46:1"}, {"v": "Jesus le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mi.", "r": "Juan 14:6"}, {"v": "Me mostraras la senda de la vida; En tu presencia hay plenitud de gozo; Delicias a tu diestra para siempre.", "r": "Salmo 16:11"}, {"v": "El corazon alegre constituye buen remedio; Mas el espiritu triste seca los huesos.", "r": "Proverbios 17:22"}, {"v": "Porque nada hay imposible para Dios.", "r": "Lucas 1:37"}, {"v": "Sean vuestras costumbres sin avaricia, contentos con lo que teneis ahora; porque el dijo: No te desamparare, ni te dejare;", "r": "Hebreos 13:5"}, {"v": "Acerquemonos, pues, confiadamente al trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro.", "r": "Hebreos 4:16"}, {"v": "Pedid, y se os dara; buscad, y hallareis; llamad, y se os abrira.", "r": "Mateo 7:7"}, {"v": "Que, pues, diremos a esto? Si Dios es por nosotros, quien contra nosotros?", "r": "Romanos 8:31"}, {"v": "Bienaventurados los pacificadores, porque ellos seran llamados hijos de Dios.", "r": "Mateo 5:9"}, {"v": "Es, pues, la fe la certeza de lo que se espera, la conviccion de lo que no se ve.", "r": "Hebreos 11:1"}];
        const rellenoLogos = ["DIOS", "AMOR", "FE", "GRACIA", "PERDON", "SALVACION", "MISERICORDIA", "JUSTICIA", "VERDAD", "VIDA", "LUZ", "ESPIRITU", "CRUZ", "REINO", "EVANGELIO", "PALABRA", "PROMESA", "OBEDIENCIA", "SABIDURIA", "ESPERANZA", "GOZO", "PAZ", "FORTALEZA", "BENDICION", "SANTIDAD", "HUMILDAD", "IGLESIA", "ADORACION", "ORACION", "VICTORIA", "ETERNIDAD", "CIELO", "BONDAD", "GLORIA", "BIBLIA", "CRISTO", "LOGOS", "KENNEDY", "BOGOTA"];
        
        let nivelActualIdx = 0;
        let wordsPos = {};
        let foundCount = 0;
        let isSelecting = false;
        let startCell = null;
        let currentSelection = [];
        let audioCtx;

        function getCompletados() {
            const data = localStorage.getItem('logos_progreso_vFinal');
            return data ? JSON.parse(data) : [];
        }

        function guardarProgreso(idx) {
            let lista = getCompletados();
            if(!lista.includes(idx)) lista.push(idx);
            localStorage.setItem('logos_progreso_vFinal', JSON.stringify(lista));
        }

        function seleccionarNivel() {
            const hechos = getCompletados();
            if(hechos.length >= niveles.length) {
                localStorage.setItem('logos_progreso_vFinal', JSON.stringify([]));
                return 0;
            }
            for(let i=0; i<niveles.length; i++) {
                if(!hechos.includes(i)) return i;
            }
            return 0;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(f, d) {
            initAudio(); 
            if (!audioCtx || audioCtx.state !== 'running') return;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function cargarNivel() {
            nivelActualIdx = seleccionarNivel();
            const data = niveles[nivelActualIdx];
            const totalCompletados = getCompletados().length + 1;
            
            document.getElementById('lvl-tag').textContent = `RETO #${totalCompletados} - ${data.r}`;
            document.getElementById('verse-text').textContent = `"${data.v}"`;
            
            // Limpiar palabras: solo letras, min 3 caracteres
            let palabras = data.v.toUpperCase()
                .normalize("NFD").replace(/[̀-ͯ]/g, "") // Quitar acentos
                .split(/[\s,.;?]+/)
                .filter(p => p.length >= 3);
            
            palabras = [...new Set(palabras)];
            
            // Rellenar con palabras de la librería si hay pocas
            while(palabras.length < 12) {
                let r = rellenoLogos[Math.floor(Math.random() * rellenoLogos.length)];
                if(!palabras.includes(r)) palabras.push(r);
            }
            generarTablero(palabras.slice(0, 15));
        }

        function generarTablero(palabras) {
            const TAM = 12;
            const grid = document.getElementById('grid');
            const list = document.getElementById('word-list');
            grid.innerHTML = ''; list.innerHTML = ''; foundCount = 0; wordsPos = {};
            
            let matriz = Array(TAM).fill().map(() => Array(TAM).fill(''));
            const direcciones = [[0, 1], [1, 0], [1, 1], [0, -1], [-1, 0], [1, -1], [-1, 1], [-1, -1]];
            
            palabras.sort((a,b) => b.length - a.length).forEach(palabra => {
                let puesta = false, intentos = 0;
                while(!puesta && intentos < 100) {
                    let [dr, dc] = direcciones[Math.floor(Math.random() * direcciones.length)];
                    let r = Math.floor(Math.random() * TAM), c = Math.floor(Math.random() * TAM);
                    
                    if (r + dr * (palabra.length-1) < TAM && r + dr * (palabra.length-1) >= 0 && 
                        c + dc * (palabra.length-1) < TAM && c + dc * (palabra.length-1) >= 0) {
                        let ok = true;
                        for(let j=0; j<palabra.length; j++) {
                            let targetR = r+dr*j, targetC = c+dc*j;
                            if(matriz[targetR][targetC] !== '' && matriz[targetR][targetC] !== palabra[j]) ok = false;
                        }
                        
                        if(ok) {
                            wordsPos[palabra] = [];
                            for(let j=0; j<palabra.length; j++) {
                                matriz[r+dr*j][c+dc*j] = palabra[j];
                                wordsPos[palabra].push(`${r+dr*j}-${c+dc*j}`);
                            }
                            puesta = true;
                            const s = document.createElement('span'); s.className = 'word-item';
                            s.id = 'w-'+palabra; s.textContent = palabra; list.appendChild(s);
                        }
                    }
                    intentos++;
                }
            });

            for(let r=0; r<TAM; r++) {
                for(let c=0; c<TAM; c++) {
                    const d = document.createElement('div'); d.className = 'cell';
                    d.textContent = matriz[r][c] || String.fromCharCode(65+Math.floor(Math.random()*26));
                    d.dataset.r = r; d.dataset.c = c; grid.appendChild(d);
                }
            }
        }

        function getCell(e) {
            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            return el && el.classList.contains('cell') ? el : null;
        }

        function actualizarSeleccion(endCell) {
            if(!startCell || !endCell) return;
            const r1 = parseInt(startCell.dataset.r), c1 = parseInt(startCell.dataset.c);
            const r2 = parseInt(endCell.dataset.r), c2 = parseInt(endCell.dataset.c);
            
            let dr = r2 - r1, dc = c2 - c1;
            if (dr === 0 && dc === 0) return;

            let absR = Math.abs(dr), absC = Math.abs(dc);
            let stepR = 0, stepC = 0, steps = 0;

            if (absR > absC * 1.5) { stepR = dr / absR; stepC = 0; steps = absR; } 
            else if (absC > absR * 1.5) { stepR = 0; stepC = dc / absC; steps = absC; } 
            else { stepR = dr / absR; stepC = dc / absC; steps = absR; }

            document.querySelectorAll('.sel').forEach(c => c.classList.remove('sel'));
            currentSelection = [];
            
            for(let i = 0; i <= steps; i++) {
                let cr = Math.round(r1 + i * stepR), cc = Math.round(c1 + i * stepC);
                const cell = document.querySelector(`[data-r="${cr}"][data-c="${cc}"]`);
                if(cell) {
                    cell.classList.add('sel');
                    currentSelection.push(`${cr}-${cc}`);
                }
            }
        }

        const gridElement = document.getElementById('grid');
        gridElement.addEventListener('touchstart', (e) => {
            isSelecting = true;
            startCell = getCell(e);
            if(startCell) playSound(440, 0.05);
        });

        gridElement.addEventListener('touchmove', (e) => {
            if(isSelecting) actualizarSeleccion(getCell(e));
        });

        window.addEventListener('touchend', () => {
            if(!isSelecting) return;
            isSelecting = false;
            
            const selStr = currentSelection.join(',');
            for(let pal in wordsPos) {
                const target = wordsPos[pal].join(',');
                const targetRev = [...wordsPos[pal]].reverse().join(',');
                
                if((selStr === target || selStr === targetRev) && !document.getElementById('w-'+pal).classList.contains('word-found')) {
                    currentSelection.forEach(pos => {
                        const [r, c] = pos.split('-');
                        document.querySelector(`[data-r="${r}"][data-c="${c}"]`).classList.add('found');
                    });
                    document.getElementById('w-'+pal).classList.add('word-found');
                    playSound(523, 0.15); foundCount++;
                    
                    if(foundCount === Object.keys(wordsPos).length) {
                        guardarProgreso(nivelActualIdx);
                        setTimeout(() => {
                            document.getElementById('stats-text').innerHTML = `¡Has memorizado ya <br><b>${getCompletados().length} versículos</b> con nosotros!`;
                            document.getElementById('ad-modal').style.display = 'flex';
                            playSound(659, 0.3);
                        }, 600);
                    }
                }
            }
            document.querySelectorAll('.sel').forEach(c => c.classList.remove('sel'));
            currentSelection = [];
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            document.getElementById('overlay').style.display = 'none';
            cargarNivel();
            const asis = document.getElementById('asistente');
            asis.style.display = 'block';
            setTimeout(() => { asis.style.display = 'none'; }, 7000);
        });

        document.getElementById('btn-next-lvl').addEventListener('click', () => {
            document.getElementById('ad-modal').style.display = 'none';
            cargarNivel();
        });
    </script>
</body>
</html>
