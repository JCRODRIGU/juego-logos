        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(f, d) {
            initAudio(); 
            if (!audioCtx || audioCtx.state !== 'running') return;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function generarTablero(palabras) {

                    let [dr, dc] = direcciones[Math.floor(Math.random() * direcciones.length)];
                    let r = Math.floor(Math.random() * TAM), c = Math.floor(Math.random() * TAM);
                    if (r + dr * (palabra.length-1) < TAM && r + dr * (palabra.length-1) >= 0 && c + dc * (palabra.length-1) < TAM && c + dc * (palabra.length-1) >= 0) {
                        let ok = true;
                        for(let j=0; j<palabra.length; j++) if(matriz[r+dr*j][c+dc*j] !== '' && matriz[r+dr*j][c+dc*j] !== palabra[j]) ok = false;
                        if(ok) {
                            wordsPos[palabra] = [];
                            for(let j=0; j<palabra.length; j++) { matriz[r+dr*j][c+dc*j] = palabra[j]; wordsPos[palabra].push(`${r+dr*j}-${c+dc*j}`); }
                            puesta = true;
                            const s = document.createElement('span'); s.className = 'word-item'; s.id = 'w-'+palabra; s.textContent = palabra; list.appendChild(s);
                        }
                    }
                    intentos++;
                }
            });
            for(let r=0; r<TAM; r++) {
                for(let c=0; c<TAM; c++) {
                    const d = document.createElement('div'); d.className = 'cell';
                    d.textContent = matriz[r][c] || String.fromCharCode(65+Math.floor(Math.random()*26));
                    d.dataset.pos = `${r}-${c}`; grid.appendChild(d);
                }
            }
        }

        function handleTouch(e) {
            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if(el && el.classList.contains('cell')) {
                const pos = el.dataset.pos;
                if(!activeCoords.includes(pos)) {
                    activeCoords.push(pos); el.classList.add('sel');
                    playSound(440, 0.05); check();
                }
            }
        }

        document.getElementById('grid').addEventListener('touchstart', (e) => { isSelecting = true; activeCoords = []; handleTouch(e); });
        document.getElementById('grid').addEventListener('touchmove', (e) => { if(isSelecting) e.preventDefault(); handleTouch(e); }, {passive: false});
        window.addEventListener('touchend', () => { document.querySelectorAll('.sel').forEach(c => c.classList.remove('sel')); isSelecting = false; });

        function check() {
            for(let word in wordsPos) {
                // Si la palabra no ha sido marcada y todas sus letras están seleccionadas...
                if(!document.getElementById('w-'+word).classList.contains('word-found') && 
                   wordsPos[word].every(p => document.querySelector(`[data-pos="${p}"]`).classList.contains('sel') || 
                   document.querySelector(`[data-pos="${p}"]`).classList.contains('found'))) {
                    
                    wordsPos[word].forEach(p => document.querySelector(`[data-pos="${p}"]`).classList.add('found'));
                    document.getElementById('w-'+word).classList.add('word-found');
                    playSound(523, 0.15); 
                    foundCount++;

                    // --- AQUÍ ESTÁ EL TRUCO: SI GANÓ EL NIVEL ---
                    if(foundCount === Object.keys(wordsPos).length) { 
                        
                        // 1. Enviamos a la hoja de Tracking
                        enviarDatosGoogle({
                            fecha: new Date().toLocaleDateString(),
                            usuario: nombreUsuario,
                            evento: "Nivel Completado",
                            nivel: nivelActualIdx + 1,
                            tiempo: new Date().toLocaleTimeString()
                        });

                        // 2. Guardamos progreso local
                        const hechos = getCompletados();
                        if(!hechos.includes(nivelActualIdx)) {
                            hechos.push(nivelActualIdx);
                            localStorage.setItem('logos_progreso_vFinal', JSON.stringify(hechos));
                        }
                        
                        // 3. Mostramos el trofeo
                        setTimeout(mostrarLogro, 600); 
                    }
                }
            }
        }

        function mostrarLogro() {
            const total = getCompletados().length;
            document.getElementById('stats-text').innerHTML = `¡Felicidades <b>${nombreUsuario}</b>!<br>Has completado un total de <br><b>${total} Versículos Bíblicos</b>`;
            document.getElementById('ad-modal').style.display = 'flex';
            playSound(659, 0.3);
        }
    </script>
</body>
</html>
