
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sopa de Letras - Librería Logos</title>
    <style>
        * { touch-action: auto; user-select: none; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background: #ffffff; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* Evita que el contenido se meta bajo el notch del iPhone */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden; 
        }

        /* Cabecera */
        .header { 
            background: #2e7d32; 
            color: white; 
            padding: 10px; 
            font-weight: bold; 
            font-size: 1.1em; 
            flex-shrink: 0; 
        }
        
        #verse-container { 
            background: #f1f8e9; 
            padding: 10px; 
            margin: 0; 
            min-height: 60px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            border-bottom: 2px solid #2e7d32;
        }
        #verse-text { font-size: 0.95rem; color: #1b5e20; font-weight: 700; line-height: 1.2; }

        /* Contenedor de la Sopa - Se ajusta al centro */
        #grid-container { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px;
            background: #fafafa;
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(12, 1fr); 
            width: 95vw; 
            max-width: 420px; 
            background: #ddd; 
            gap: 1px; 
            border: 3px solid #2e7d32; 
            touch-action: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .cell { 
            aspect-ratio: 1/1; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 16px; 
            text-transform: uppercase; 
        }
        .sel { background: #fff176 !important; }
        .found { background: #c8e6c9 !important; color: #1b5e20 !important; }

        /* Lista de Palabras Abajo */
        #word-list-container {
            height: 140px;
            background: #ffffff;
            border-top: 2px solid #2e7d32;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        #word-list-title {
            font-size: 0.8em;
            color: #666;
            padding: 5px;
            font-weight: bold;
            background: #eee;
        }

        #word-list { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 6px; 
            padding: 10px; 
            overflow-y: auto;
            flex-grow: 1;
        }
        .word-item { 
            padding: 6px 12px; 
            background: #e8f5e9; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            color: #2e7d32; 
            border: 1px solid #c8e6c9; 
        }
        .word-found { background: #2e7d32 !important; color: white !important; text-decoration: line-through; }

        /* Modales y Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2e7d32; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; color: white; padding: 25px; }
        .btn-start { padding: 18px 40px; background: white; color: #2e7d32; border-radius: 50px; font-size: 1.4em; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; width: 80%; }
        #input-nombre { padding: 15px; border-radius: 10px; border: none; margin-top: 10px; width: 80%; font-size: 1.1em; text-align: center; }

        .modal-ad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 4000; }
        .ad-card { background: white; padding: 30px; border-radius: 20px; width: 85%; text-align: center; }
        .btn-next { background: #2e7d32; color: white; padding: 15px; border: none; border-radius: 30px; width: 100%; font-weight: bold; margin-top: 15px; }

        #banner-publicidad { 
            position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); 
            background: #fff176; color: #333; padding: 8px 15px; 
            border-radius: 20px; font-size: 0.85em; z-index: 2500; 
            font-weight: bold; display: none; border: 2px solid #2e7d32;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin:0">¡BIENVENIDO!</h2>
        <p>Librería Cristiana Logos</p>
        <input type="text" id="input-nombre" placeholder="Escribe tu nombre..." maxlength="15">
        <button class="btn-start" id="start-btn">EMPEZAR</button>
    </div>

    <div id="banner-publicidad"></div>

    <div id="ad-modal" class="modal-ad">
        <div class="ad-card">
            <h2 style="color:#2e7d32">¡MUY BIEN!</h2>
            <p id="stats-text"></p>
            <button class="btn-next" id="btn-next-lvl">SIGUIENTE RETO</button>
        </div>
    </div>

    <div class="header" id="lvl-tag">RETO #1</div>
    <div id="verse-container"><div id="verse-text"></div></div>
    
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <div id="word-list-container">
        <div id="word-list-title">BUSCA ESTAS PALABRAS:</div>
        <div id="word-list"></div>
    </div>

    <script>
        const niveles = [{"v": "Lampara es a mis pies tu palabra, Y lumbrera a mi camino.", "r": "Salmo 119:105"}, {"v": "Todo lo puedo en Cristo que me fortalece.", "r": "Filipenses 4:13"}, {"v": "Jehova es mi pastor; nada me faltara.", "r": "Salmo 23:1"}, {"v": "En el principio creo Dios los cielos y la tierra.", "r": "Genesis 1:1"}, {"v": "Ellos dijeron: Cree en el Senor Jesucristo, y seras salvo, tu y tu casa.", "r": "Hechos 16:31"}, {"v": "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece;", "r": "1 Corintios 13:4"}, {"v": "Clama a mi, y yo te respondere, y te ensenare cosas grandes y ocultas que tu no conoces.", "r": "Jeremias 33:3"}, {"v": "Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os seran anadidas.", "r": "Mateo 6:33"}, {"v": "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehova tu Dios estara contigo en dondequiera que vayas.", "r": "Josue 1:9"}, {"v": "Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.", "r": "Salmo 46:1"}, {"v": "Jesus le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mi.", "r": "Juan 14:6"}];
        const rellenoLogos = ["DIOS", "AMOR", "FE", "GRACIA", "PERDON", "SALVACION", "MISERICORDIA", "JUSTICIA", "VERDAD", "VIDA", "LUZ", "ESPIRITU", "CRUZ", "REINO", "EVANGELIO", "PALABRA", "PROMESA", "OBEDIENCIA", "SABIDURIA", "ESPERANZA", "GOZO", "PAZ", "FORTALEZA", "BENDICION", "SANTIDAD", "HUMILDAD", "IGLESIA", "ADORACION", "ORACION", "VICTORIA", "ETERNIDAD", "CIELO", "BONDAD", "GLORIA", "BIBLIA", "CRISTO", "LOGOS", "KENNEDY", "BOGOTA"];
        const anuncios = ["\u00a1Lunes de Mayo: 10% DCTO en Biblias Reina Valera!", "\u00bfBuscas un regalo? Pregunta por nuestras cajas de promesas.", "Vis\u00edtanos en Kennedy Central para conocer m\u00e1s novedades.", "Librer\u00eda Logos: Alimentando tu esp\u00edritu con la Palabra.", "\u00bfYa conoces nuestro cat\u00e1logo digital? P\u00eddelo por WhatsApp."];
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbxgXpHlAcMh5wMY1ea23GBLAnpJlM8xC_tAooWgHljg3D7ZimGBtdOaBKyTZbTYDmEF/exec";
        
        let nivelActualIdx = 0;
        let wordsPos = {};
        let foundCount = 0;
        let activeCoords = [];
        let isSelecting = false;
        let audioCtx;
        let nombreUsuario = "";

        window.onload = function() {
            const guardado = localStorage.getItem('logos_nombre_usuario');
            if (guardado) { nombreUsuario = guardado; comenzarJuego(); } 
            else { document.getElementById('overlay').style.display = 'flex'; }
        };

        function enviarTracking(evento, nivel) {
            fetch(GOOGLE_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ usuario: nombreUsuario, evento: evento, nivel: nivel + 1 })
            }).catch(e => {});
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(f, d) {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const val = document.getElementById('input-nombre').value.trim();
            if(!val) return alert("Dinos tu nombre");
            nombreUsuario = val;
            localStorage.setItem('logos_nombre_usuario', val);
            initAudio();
            document.getElementById('overlay').style.display = 'none';
            comenzarJuego();
        });

        document.getElementById('btn-next-lvl').addEventListener('click', () => {
            document.getElementById('ad-modal').style.display = 'none';
            comenzarJuego();
        });

        function comenzarJuego() {
            const hechos = JSON.parse(localStorage.getItem('logos_progreso') || '[]');
            nivelActualIdx = hechos.length % niveles.length;
            enviarTracking('Inicio', nivelActualIdx);
            cargarNivel();
        }

        function cargarNivel() {
            const data = niveles[nivelActualIdx];
            document.getElementById('lvl-tag').textContent = `RETO #${nivelActualIdx + 1} - ${data.r}`;
            document.getElementById('verse-text').textContent = `"${data.v}"`;
            let palabras = data.v.toUpperCase().split(' ').map(p => p.replace(/[^A-Z]/g, '')).filter(p => p.length >= 3);
            palabras = [...new Set(palabras)].slice(0, 12);
            generarTablero(palabras);
        }

        function generarTablero(palabras) {
            const TAM = 12;
            const grid = document.getElementById('grid');
            const list = document.getElementById('word-list');
            grid.innerHTML = ''; list.innerHTML = ''; foundCount = 0; wordsPos = {};
            let matriz = Array(TAM).fill().map(() => Array(TAM).fill(''));

            palabras.forEach(palabra => {
                let puesta = false;
                while(!puesta) {
                    let dr = Math.random() > 0.5 ? 1 : 0, dc = dr === 0 ? 1 : (Math.random() > 0.5 ? 1 : 0);
                    let r = Math.floor(Math.random() * (TAM - (dr * palabra.length)));
                    let c = Math.floor(Math.random() * (TAM - (dc * palabra.length)));
                    let ok = true;
                    for(let j=0; j<palabra.length; j++) if(matriz[r+dr*j][c+dc*j] !== '') ok = false;
                    if(ok) {
                        wordsPos[palabra] = [];
                        for(let j=0; j<palabra.length; j++) {
                            matriz[r+dr*j][c+dc*j] = palabra[j];
                            wordsPos[palabra].push(`${r+dr*j}-${c+dc*j}`);
                        }
                        puesta = true;
                        const s = document.createElement('span'); s.className = 'word-item';
                        s.id = 'w-'+palabra; s.textContent = palabra; list.appendChild(s);
                    }
                }
            });

            for(let r=0; r<TAM; r++) {
                for(let c=0; c<TAM; c++) {
                    const d = document.createElement('div'); d.className = 'cell';
                    d.textContent = matriz[r][c] || String.fromCharCode(65+Math.floor(Math.random()*26));
                    d.dataset.pos = `${r}-${c}`; grid.appendChild(d);
                }
            }
        }

        function handleTouch(e) {
            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if(el && el.classList.contains('cell')) {
                const pos = el.dataset.pos;
                if(!activeCoords.includes(pos)) {
                    activeCoords.push(pos); el.classList.add('sel');
                    playSound(440, 0.05); check();
                }
            }
        }

        document.getElementById('grid').addEventListener('touchstart', (e) => { isSelecting = true; activeCoords = []; handleTouch(e); });
        document.getElementById('grid').addEventListener('touchmove', (e) => { if(isSelecting) e.preventDefault(); handleTouch(e); }, {passive: false});
        window.addEventListener('touchend', () => { document.querySelectorAll('.sel').forEach(c => c.classList.remove('sel')); isSelecting = false; });

        function check() {
            for(let word in wordsPos) {
                if(!document.getElementById('w-'+word).classList.contains('word-found') && 
                   wordsPos[word].every(p => document.querySelector(`[data-pos="${p}"]`).classList.contains('sel') || 
                                             document.querySelector(`[data-pos="${p}"]`).classList.contains('found'))) {
                    wordsPos[word].forEach(p => document.querySelector(`[data-pos="${p}"]`).classList.add('found'));
                    document.getElementById('w-'+word).classList.add('word-found');
                    playSound(523, 0.1); foundCount++;
                    if(foundCount === Object.keys(wordsPos).length) {
                        let hechos = JSON.parse(localStorage.getItem('logos_progreso') || '[]');
                        hechos.push(nivelActualIdx);
                        localStorage.setItem('logos_progreso', JSON.stringify(hechos));
                        enviarTracking('Nivel Superado', nivelActualIdx);
                        setTimeout(() => { 
                            document.getElementById('stats-text').textContent = `¡Felicidades ${nombreUsuario}!`;
                            document.getElementById('ad-modal').style.display = 'flex'; 
                        }, 500);
                    }
                }
            }
        }
    </script>
</body>
</html>
