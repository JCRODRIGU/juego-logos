
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sopa de Letras - Librería Logos</title>
    <style>
        * { touch-action: auto; user-select: none; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background: #ffffff; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding-top: env(safe-area-inset-top); /* Evita la franja negra del iPhone */
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden; 
        }

        /* Cabecera Fija */
        .header { 
            background: #2e7d32; 
            color: white; 
            padding: 10px; 
            font-weight: bold; 
            font-size: 1.1em; 
            flex-shrink: 0; 
        }
        
        #verse-container { 
            background: #f1f8e9; 
            padding: 12px; 
            margin: 0; 
            min-height: 80px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            border-bottom: 2px solid #2e7d32;
        }
        #verse-text { font-size: 1.1rem; color: #1b5e20; font-weight: 700; line-height: 1.2; }

        /* Contenedor de la Sopa */
        #grid-container { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 5px;
            background: #fafafa;
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(12, 1fr); 
            width: 96vw; 
            max-width: 420px; 
            background: #ddd; 
            gap: 1px; 
            border: 3px solid #2e7d32; 
            touch-action: none; 
        }
        .cell { 
            aspect-ratio: 1/1; 
            background: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 17px; 
            text-transform: uppercase; 
        }
        .sel { background: #fff176 !important; }
        .found { background: #c8e6c9 !important; color: #1b5e20 !important; }

        /* Lista de Palabras Inferior */
        #word-list-container {
            height: 120px;
            background: #ffffff;
            border-top: 2px solid #2e7d32;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #word-list { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 5px; 
            padding: 10px; 
            overflow-y: auto;
            flex-grow: 1;
        }
        .word-item { 
            padding: 5px 10px; 
            background: #e8f5e9; 
            border-radius: 15px; 
            font-size: 12px; 
            font-weight: bold; 
            color: #2e7d32; 
            border: 1px solid #c8e6c9; 
        }
        .word-found { background: #2e7d32 !important; color: white !important; text-decoration: line-through; }

        /* Banner Publicitario (Se desliza sobre las palabras) */
        #banner-publicidad { 
            position: absolute; bottom: -60px; left: 0; width: 100%;
            background: #fff176; color: #2e7d32; padding: 10px; 
            font-size: 0.9em; font-weight: bold; transition: bottom 0.5s ease;
            z-index: 5; border-top: 2px solid #2e7d32;
        }
        #banner-publicidad.show { bottom: 0; }

        /* Modales */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2e7d32; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; color: white; padding: 20px; text-align: center; }
        .btn-start { padding: 18px 40px; background: white; color: #2e7d32; border-radius: 50px; font-size: 1.3em; border: none; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .modal-ad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 4000; }
        .ad-card { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 4px solid #2e7d32; }
        .btn-next { background: #2e7d32; color: white; padding: 15px; border: none; border-radius: 30px; width: 100%; font-weight: bold; margin-top: 15px; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="margin:0; font-size: 1.8em;">Librería Logos</h1>
        <p style="margin: 15px 0;">Busca las palabras deslizando tu dedo.<br>¡Un regalo para tu espíritu!</p>
        <button class="btn-start" id="start-btn">EMPEZAR JUEGO</button>
        <p style="font-size: 0.8em; margin-top: 30px; opacity: 0.8;">Kennedy Central, Bogotá</p>
    </div>

    <div class="header" id="lvl-tag">RETO #1</div>
    <div id="verse-container"><div id="verse-text"></div></div>
    
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <div id="word-list-container">
        <div id="banner-publicidad">📢 <span id="publi-texto"></span></div>
        <div id="word-list"></div>
    </div>

    <div id="ad-modal" class="modal-ad">
        <div class="ad-card">
            <h2 style="color:#2e7d32; margin-top:0;">¡EXCELENTE!</h2>
            <p id="stats-text"></p>
            <button class="btn-next" id="btn-next-lvl">SIGUIENTE NIVEL</button>
        </div>
    </div>

    <script>
        const niveles = [{"v": "Lampara es a mis pies tu palabra, Y lumbrera a mi camino.", "r": "Salmo 119:105"}, {"v": "Todo lo puedo en Cristo que me fortalece.", "r": "Filipenses 4:13"}, {"v": "Jehova es mi pastor; nada me faltara.", "r": "Salmo 23:1"}, {"v": "En el principio creo Dios los cielos y la tierra.", "r": "Genesis 1:1"}, {"v": "Ellos dijeron: Cree en el Senor Jesucristo, y seras salvo, tu y tu casa.", "r": "Hechos 16:31"}, {"v": "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece;", "r": "1 Corintios 13:4"}, {"v": "Clama a mi, y yo te respondere, y te ensenare cosas grandes y ocultas que tu no conoces.", "r": "Jeremias 33:3"}, {"v": "Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os seran anadidas.", "r": "Mateo 6:33"}, {"v": "Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehova tu Dios estara contigo en dondequiera que vayas.", "r": "Josue 1:9"}, {"v": "Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.", "r": "Salmo 46:1"}, {"v": "Jesus le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mi.", "r": "Juan 14:6"}, {"v": "Me mostraras la senda de la vida; En tu presencia hay plenitud de gozo; Delicias a tu diestra para siempre.", "r": "Salmo 16:11"}, {"v": "El corazon alegre constituye buen remedio; Mas el espiritu triste seca los huesos.", "r": "Proverbios 17:22"}, {"v": "Porque nada hay imposible para Dios.", "r": "Lucas 1:37"}, {"v": "Sean vuestras costumbres sin avaricia, contentos con lo que teneis ahora; porque el dijo: No te desamparare, ni te dejare;", "r": "Hebreos 13:5"}, {"v": "Acerquemonos, pues, confiadamente al trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro.", "r": "Hebreos 4:16"}, {"v": "Pedid, y se os dara; buscad, y hallareis; llamad, y se os abrira.", "r": "Mateo 7:7"}, {"v": "Que, pues, diremos a esto? Si Dios es por nosotros, quien contra nosotros?", "r": "Romanos 8:31"}, {"v": "Bienaventurados los pacificadores, porque ellos seran llamados hijos de Dios.", "r": "Mateo 5:9"}, {"v": "Es, pues, la fe la certeza de lo que se espera, la conviccion de lo que no se ve.", "r": "Hebreos 11:1"}];
        const rellenoLogos = ["DIOS", "AMOR", "FE", "GRACIA", "PERDON", "SALVACION", "MISERICORDIA", "JUSTICIA", "VERDAD", "VIDA", "LUZ", "ESPIRITU", "CRUZ", "REINO", "EVANGELIO", "PALABRA", "PROMESA", "OBEDIENCIA", "SABIDURIA", "ESPERANZA", "GOZO", "PAZ", "FORTALEZA", "BENDICION", "SANTIDAD", "HUMILDAD", "IGLESIA", "ADORACION", "ORACION", "VICTORIA", "ETERNIDAD", "CIELO", "BONDAD", "GLORIA", "BIBLIA", "CRISTO", "LOGOS", "KENNEDY", "BOGOTA"];
        const anuncios = ["\u00a1Lunes de Mayo: 10% DCTO en Biblias Reina Valera!", "\u00bfBuscas un regalo? Pregunta por nuestras cajas de promesas.", "Nuevos separadores con vers\u00edculos disponibles en caja.", "Vis\u00edtanos en Kennedy Central para conocer m\u00e1s novedades.", "Pregunta por nuestro cat\u00e1logo de Biblias de estudio.", "\u00bfYa conoces nuestro cat\u00e1logo digital? P\u00eddelo por WhatsApp."];
        
        let nivelActualIdx = 0;
        let wordsPos = {};
        let foundCount = 0;
        let activeCoords = [];
        let isSelecting = false;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(f, d) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function mostrarBanner() {
            const banner = document.getElementById('banner-publicidad');
            document.getElementById('publi-texto').textContent = anuncios[Math.floor(Math.random() * anuncios.length)];
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 5000);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio(); // Crítico: Se activa con el primer toque del usuario
            document.getElementById('overlay').style.display = 'none';
            comenzarJuego();
        });

        document.getElementById('btn-next-lvl').addEventListener('click', () => {
            document.getElementById('ad-modal').style.display = 'none';
            comenzarJuego();
        });

        function comenzarJuego() {
            const hechos = JSON.parse(localStorage.getItem('logos_progreso_v2') || '[]');
            nivelActualIdx = hechos.length % niveles.length;
            cargarNivel();
            setTimeout(mostrarBanner, 2000);
        }

        function cargarNivel() {
            const data = niveles[nivelActualIdx];
            document.getElementById('lvl-tag').textContent = `RETO #${nivelActualIdx + 1} - ${data.r}`;
            document.getElementById('verse-text').textContent = `"${data.v}"`;
            let palabras = data.v.toUpperCase().split(' ').map(p => p.replace(/[^A-Z]/g, '')).filter(p => p.length >= 3);
            palabras = [...new Set(palabras)].slice(0, 12);
            generarTablero(palabras);
        }

        function generarTablero(palabras) {
            const TAM = 12;
            const grid = document.getElementById('grid');
            const list = document.getElementById('word-list');
            grid.innerHTML = ''; list.innerHTML = ''; foundCount = 0; wordsPos = {};
            let matriz = Array(TAM).fill().map(() => Array(TAM).fill(''));

            palabras.forEach(palabra => {
                let puesta = false, intentos = 0;
                while(!puesta && intentos < 30) {
                    let dr = Math.random() > 0.5 ? 1 : 0, dc = dr === 0 ? 1 : 0;
                    let r = Math.floor(Math.random() * (TAM - (dr * palabra.length)));
                    let c = Math.floor(Math.random() * (TAM - (dc * palabra.length)));
                    let ok = true;
                    for(let j=0; j<palabra.length; j++) if(matriz[r+dr*j][c+dc*j] !== '') ok = false;
                    if(ok) {
                        wordsPos[palabra] = [];
                        for(let j=0; j<palabra.length; j++) {
                            matriz[r+dr*j][c+dc*j] = palabra[j];
                            wordsPos[palabra].push(`${r+dr*j}-${c+dc*j}`);
                        }
                        puesta = true;
                        const s = document.createElement('span'); s.className = 'word-item';
                        s.id = 'w-'+palabra; s.textContent = palabra; list.appendChild(s);
                    }
                    intentos++;
                }
            });

            for(let r=0; r<TAM; r++) {
                for(let c=0; c<TAM; c++) {
                    const d = document.createElement('div'); d.className = 'cell';
                    d.textContent = matriz[r][c] || String.fromCharCode(65+Math.floor(Math.random()*26));
                    d.dataset.pos = `${r}-${c}`; grid.appendChild(d);
                }
            }
        }

        function handleTouch(e) {
            const t = e.touches ? e.touches[0] : e;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if(el && el.classList.contains('cell')) {
                const pos = el.dataset.pos;
                if(!activeCoords.includes(pos)) {
                    activeCoords.push(pos); el.classList.add('sel');
                    playSound(440, 0.05); // Sonido de selección
                    check();
                }
            }
        }

        document.getElementById('grid').addEventListener('touchstart', (e) => { isSelecting = true; activeCoords = []; handleTouch(e); });
        document.getElementById('grid').addEventListener('touchmove', (e) => { if(isSelecting) e.preventDefault(); handleTouch(e); }, {passive: false});
        window.addEventListener('touchend', () => { document.querySelectorAll('.sel').forEach(c => c.classList.remove('sel')); isSelecting = false; });

        function check() {
            for(let word in wordsPos) {
                if(!document.getElementById('w-'+word).classList.contains('word-found') && 
                   wordsPos[word].every(p => document.querySelector(`[data-pos="${p}"]`).classList.contains('sel') || 
                                             document.querySelector(`[data-pos="${p}"]`).classList.contains('found'))) {
                    wordsPos[word].forEach(p => document.querySelector(`[data-pos="${p}"]`).classList.add('found'));
                    document.getElementById('w-'+word).classList.add('word-found');
                    playSound(523, 0.15); foundCount++;
                    if(foundCount === Object.keys(wordsPos).length) {
                        let hechos = JSON.parse(localStorage.getItem('logos_progreso_v2') || '[]');
                        hechos.push(nivelActualIdx);
                        localStorage.setItem('logos_progreso_v2', JSON.stringify(hechos));
                        setTimeout(() => { 
                            document.getElementById('stats-text').textContent = `¡Has superado ${hechos.length} retos bíblicos!`;
                            document.getElementById('ad-modal').style.display = 'flex'; 
                            playSound(659, 0.3);
                        }, 500);
                    }
                }
            }
        }
    </script>
</body>
</html>
