
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sopa de Letras - Librería Logos</title>
    <style>
        * { touch-action: none; user-select: none; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #ffffff; margin: 0; overflow: hidden; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2e7d32; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; padding: 20px; }
        .btn-start { padding: 18px 40px; background: white; color: #2e7d32; border-radius: 50px; font-size: 1.4em; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        #asistente { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: rgba(46, 125, 50, 0.95); color: white; padding: 15px 20px; 
            border-radius: 25px; font-size: 0.9em; z-index: 1500; display: none; 
            width: 90%; max-width: 400px; box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
            border: 1px solid #fff; transition: opacity 0.5s;
        }

        #penalty-msg { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #d32f2f; color: white; padding: 15px 25px; border-radius: 12px;
            font-weight: bold; z-index: 500; display: none; white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .header { background: #2e7d32; color: white; padding: 10px; font-weight: bold; font-size: 1.1em; }
        #verse-container { background: #e8f5e9; padding: 15px; margin: 5px 10px; border-radius: 12px; border-left: 6px solid #2e7d32; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        #verse-text { font-size: 1.1rem; color: #1b5e20; font-weight: 800; line-height: 1.2; }

        #grid-wrapper { position: relative; width: 96vw; max-width: 440px; margin: 0 auto; }
        #grid { display: grid; grid-template-columns: repeat(12, 1fr); background: #bbb; gap: 1px; border: 3px solid #2e7d32; }
        .cell { aspect-ratio: 1/1; background: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; text-transform: uppercase; pointer-events: none; }
        .sel { background: #fff176 !important; transform: scale(0.9); }
        .found { background: #c8e6c9 !important; color: #1b5e20 !important; border: 1px solid #81c784; }

        #word-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 10px; height: 110px; overflow-y: auto; background: #f9f9f9; border-top: 1px solid #ddd; }
        .word-item { padding: 4px 8px; background: white; border-radius: 10px; font-size: 12px; font-weight: bold; color: #2e7d32; border: 1px solid #2e7d32; }
        .word-found { background: #2e7d32 !important; color: white !important; text-decoration: line-through; }

        .modal-ad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .ad-card { background: white; color: #333; padding: 30px 20px; border-radius: 20px; width: 85%; max-width: 340px; text-align: center; border: 4px solid #2e7d32; }
        .btn-next { background: #2e7d32; color: white; padding: 18px; border: none; border-radius: 35px; font-weight: bold; width: 100%; font-size: 1.1em; cursor: pointer; margin-top: 20px; }
        .wa-link { color: white; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="overlay">
        <div style="font-size: 1.6em; font-weight: 800; margin-bottom: 15px; line-height: 1.2;">Este es un regalo especial para ti por ser Nuestro Cliente</div>
        <div style="font-size: 1.1em; margin-bottom: 25px; padding: 0 15px;">Busca las palabras del versículo deslizando tu dedo en la sopa de letras. <br><b>¡Diviértete!</b></div>
        <div style="font-weight: bold; font-size: 1.4em;">Librería Cristiana Logos</div>
        <div style="font-size: 0.9em; margin-top: 5px;">Calle 35C Sur No 78A-18 Kennedy Central Bogota, Colombia</div>
        <div style="font-size: 1em; margin-top: 8px;">Celular: <a href="https://wa.me/573125756581" class="wa-link">312-5756581</a></div>
        <button class="btn-start" id="start-btn">EMPEZAR RETO</button>
    </div>

    <div id="asistente"></div>

    <div id="ad-modal" class="modal-ad">
        <div class="ad-card">
            <div style="font-size: 50px;">🏆</div>
            <div style="font-size: 1.5em; font-weight: 800; color: #2e7d32;">¡RETO SUPERADO!</div>
            <p id="stats-text" style="font-size: 1.1em; margin: 15px 0;"></p>
            <button class="btn-next" id="btn-next-lvl">CONTINUAR</button>
        </div>
    </div>

    <div class="header" id="lvl-tag">NIVEL 1</div>
    <div id="verse-container"><div id="verse-text"></div></div>
    
    <div id="grid-wrapper">
        <div id="penalty-msg">¡ANALIZA MEJOR! (3s)</div>
        <div id="grid"></div>
    </div>

    <div id="word-list"></div>

    <script>
        const niveles = [{"v": "Lampara es a mis pies tu palabra, Y lumbrera a mi camino.", "r": "Salmo 119:105"}, {"v": "Todo lo puedo en Cristo que me fortalece.", "r": "Filipenses 4:13"}, {"v": "Jehova es mi pastor; nada me faltara.", "r": "Salmo 23:1"}, {"v": "En el principio creo Dios los cielos y la tierra.", "r": "Genesis 1:1"}, {"v": "Ellos dijeron: Cree en el Senor Jesucristo, y seras salvo, tu y tu casa.", "r": "Hechos 16:31"}];
        const rellenoLogos = ["DIOS", "AMOR", "FE", "GRACIA", "PERDON", "SALVACION", "MISERICORDIA", "JUSTICIA", "VERDAD", "VIDA", "LUZ", "ESPIRITU", "CRUZ", "REINO", "EVANGELIO", "PALABRA", "PROMESA", "OBEDIENCIA", "SABIDURIA", "ESPERANZA", "GOZO", "PAZ", "FORTALEZA", "BENDICION", "SANTIDAD", "HUMILDAD", "IGLESIA", "ADORACION", "ORACION", "VICTORIA", "ETERNIDAD", "CIELO", "BONDAD", "GLORIA", "BIBLIA", "CRISTO", "LOGOS", "KENNEDY", "BOGOTA"];
        const promos = ["\ud83d\udce2 <b>10% DCTO</b> en Biblias Reina Valera todos los Lunes.", "\ud83c\udf81 <b>\u00a1REGALO!</b> Separador gratis por compras superiores a $100.000.", "\ud83d\udcf1 <b>WHATSAPP:</b> Pide tu cat\u00e1logo al 312-5756581.", "\ud83d\ude4f <b>LIBRER\u00cdA LOGOS:</b> Nutriendo tu fe d\u00eda a d\u00eda."];
        
        let nivelActualIdx = 0;
        let wordsPosMap = {};
        let foundCount = 0;
        let activeCoords = [];
        let isSelecting = false;
        let audioCtx;
        let errorCounter = 0;
        let isLocked = false;
        let startCell = null;

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(f, d) {
            initAudio(); if (!audioCtx || audioCtx.state !== 'running') return;
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('overlay').style.display = 'none';
            comenzarJuego();
        });

        document.getElementById('btn-next-lvl').addEventListener('click', () => {
            document.getElementById('ad-modal').style.display = 'none';
            comenzarJuego();
        });

        function comenzarJuego() {
            errorCounter = 0; isLocked = false;
            nivelActualIdx = Math.floor(Math.random() * niveles.length);
            cargarNivel();
            mostrarPromo();
        }

        function mostrarPromo() {
            const asis = document.getElementById('asistente');
            asis.innerHTML = promos[Math.floor(Math.random() * promos.length)];
            asis.style.display = 'block'; asis.style.opacity = '1';
            setTimeout(() => { asis.style.opacity = '0'; setTimeout(() => asis.style.display = 'none', 500); }, 4000);
        }

        function cargarNivel() {
            const data = niveles[nivelActualIdx];
            document.getElementById('lvl-tag').textContent = `RETO - ${data.r}`;
            document.getElementById('verse-text').textContent = `"${data.v}"`;
            let palabras = data.v.toUpperCase().split(' ').map(p => p.replace(/[^A-Z]/g, '')).filter(p => p.length >= 3);
            generarTablero([...new Set(palabras)].slice(0,12));
        }

        function generarTablero(palabras) {
            const TAM = 12;
            const grid = document.getElementById('grid');
            const list = document.getElementById('word-list');
            grid.innerHTML = ''; list.innerHTML = ''; foundCount = 0; wordsPosMap = {};
            let matriz = Array(TAM).fill().map(() => Array(TAM).fill(''));
            const dirs = [[0,1],[1,0],[1,1],[0,-1],[-1,0],[1,-1],[-1,1],[-1,-1]];

            palabras.forEach(palabra => {
                let puesta = false, intentos = 0;
                while(!puesta && intentos < 50) {
                    let [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
                    let r = Math.floor(Math.random() * TAM), c = Math.floor(Math.random() * TAM);
                    if (r + dr*palabra.length < TAM && r + dr*palabra.length >= 0 && c + dc*palabra.length < TAM && c + dc*palabra.length >= 0) {
                        let ok = true;
                        for(let j=0; j<palabra.length; j++) if(matriz[r+dr*j][c+dc*j] !== '' && matriz[r+dr*j][c+dc*j] !== palabra[j]) ok = false;
                        if(ok) {
                            wordsPosMap[palabra] = [];
                            for(let j=0; j<palabra.length; j++) {
                                matriz[r+dr*j][c+dc*j] = palabra[j];
                                wordsPosMap[palabra].push(`${r+dr*j}-${c+dc*j}`);
                            }
                            puesta = true;
                            const s = document.createElement('span'); s.className = 'word-item'; s.id = 'w-'+palabra; s.textContent = palabra; list.appendChild(s);
                        }
                    }
                    intentos++;
                }
            });

            for(let r=0; r<TAM; r++) {
                for(let c=0; c<TAM; c++) {
                    const d = document.createElement('div'); d.className = 'cell';
                    d.textContent = matriz[r][c] || String.fromCharCode(65+Math.floor(Math.random()*26));
                    d.dataset.r = r; d.dataset.c = c; d.id = `c-${r}-${c}`;
                    grid.appendChild(d);
                }
            }
        }

        // --- LÓGICA DE SELECCIÓN MEJORADA ---
        function getCellAt(x, y) {
            const el = document.elementFromPoint(x, y);
            if (el && el.classList.contains('cell')) return el;
            return null;
        }

        const gridEl = document.getElementById('grid');

        gridEl.addEventListener('touchstart', (e) => {
            if(isLocked) return;
            const cell = getCellAt(e.touches[0].clientX, e.touches[0].clientY);
            if(cell) {
                isSelecting = true;
                activeCoords = [];
                startCell = { r: parseInt(cell.dataset.r), c: parseInt(cell.dataset.c) };
                addCell(cell);
            }
        });

        gridEl.addEventListener('touchmove', (e) => {
            if(!isSelecting || isLocked) return;
            const cell = getCellAt(e.touches[0].clientX, e.touches[0].clientY);
            if(cell) {
                const r = parseInt(cell.dataset.r);
                const c = parseInt(cell.dataset.c);
                
                // Solo añadir si es una línea recta desde el inicio
                const dr = r - startCell.r;
                const dc = c - startCell.c;
                
                if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                    // Si cambió la dirección, recalculamos la línea
                    activeCoords = [];
                    document.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
                    
                    const steps = Math.max(Math.abs(dr), Math.abs(dc));
                    const stepR = dr === 0 ? 0 : dr / steps;
                    const stepC = dc === 0 ? 0 : dc / steps;

                    for(let i=0; i<=steps; i++) {
                        const currR = startCell.r + (stepR * i);
                        const currC = startCell.c + (stepC * i);
                        const target = document.getElementById(`c-${Math.round(currR)}-${Math.round(currC)}`);
                        if(target) addCell(target);
                    }
                }
            }
        });

        window.addEventListener('touchend', () => {
            if(!isSelecting) return;
            validar();
            document.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
            isSelecting = false;
        });

        function addCell(cell) {
            const id = `${cell.dataset.r}-${cell.dataset.c}`;
            if(!activeCoords.includes(id)) {
                activeCoords.push(id);
                cell.classList.add('sel');
                playSound(440, 0.05);
            }
        }

        function validar() {
            const texto = activeCoords.map(id => document.getElementById('c-'+id).textContent).join('');
            const rev = texto.split('').reverse().join('');
            let ok = false;

            for(let p in wordsPosMap) {
                if((p === texto || p === rev) && !document.getElementById('w-'+p).classList.contains('word-found')) {
                    wordsPosMap[p].forEach(id => document.getElementById('c-'+id).classList.add('found'));
                    document.getElementById('w-'+p).classList.add('word-found');
                    playSound(523, 0.2); foundCount++; ok = true; errorCounter = 0;
                    if(foundCount === Object.keys(wordsPosMap).length) setTimeout(mostrarLogro, 500);
                    break;
                }
            }
            if(!ok && activeCoords.length > 1) {
                errorCounter++; playSound(150, 0.2);
                if(errorCounter >= 3) activarPenalizacion();
            }
        }

        function activarPenalizacion() {
            isLocked = true; errorCounter = 0;
            document.getElementById('grid').style.opacity = '0.2';
            document.getElementById('penalty-msg').style.display = 'block';
            setTimeout(() => { 
                document.getElementById('grid').style.opacity = '1'; 
                document.getElementById('penalty-msg').style.display = 'none'; 
                isLocked = false; 
            }, 3000);
        }

        function mostrarLogro() {
            document.getElementById('stats-text').innerHTML = "¡Excelente! Has completado este versículo.";
            document.getElementById('ad-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
